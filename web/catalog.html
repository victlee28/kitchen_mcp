<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Catalog</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{margin:0} header{display:flex;gap:12px;align-items:center;padding:8px 14px;background:#25231f;color:#fff}
    header a{color:#fff} header h1{font-size:16px;margin:0 auto 0 0}
    main{display:grid;grid-template-columns:220px 1fr;gap:14px;padding:14px}
    #kinds button{display:block;width:100%;text-align:left;margin:2px 0}
    #kinds button.on{font-weight:700;background:#e3dccf}
    table{border-collapse:collapse;width:100%;background:#fff} td,th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;vertical-align:top}
    .src{font-size:11px;padding:1px 6px;border-radius:8px;background:#eee}.src.workshop{background:#d9ecff}.src.user{background:#dff5d9}
    form.item{background:#fff;padding:10px;border:1px solid #ccc;border-radius:6px;margin-top:10px}
    form.item label{display:block;margin:6px 0 2px;font-weight:600} form.item textarea{width:100%;min-height:80px;font-family:monospace}
    .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .warn{color:#a40000} .ok{color:#1b6d1b}
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="catalog.title">Danh mục dữ liệu</h1>
    <label><span data-i18n="catalog.role">Vai trò</span> <select id="role"><option value="workshop"></option><option value="user"></option></select></label>
    <span id="langSlot"></span>
    <a href="/web/" data-i18n="catalog.back">Về trình thiết kế</a>
  </header>
  <main>
    <nav><div id="kinds"></div>
      <p class="row"><button id="export" data-i18n="catalog.export"></button>
        <label class="row"><span data-i18n="catalog.import"></span><input type="file" id="import" accept="application/json"></label></p></nav>
    <section><div id="status" class="status"></div><div id="list"></div><div id="editor"></div></section>
  </main>
  <script type="module" src="catalog-page.js"></script>
</body>
</html>
