[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-design-mcp"
version = "0.3.0"
description = "Thiết kế tủ bếp tham số: MCP server, web editor, rule engine, render ảnh điều khiển cho AI"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "numpy>=1.26",
  "pillow>=10",
  "jsonschema>=4.20",
]

[project.scripts]
kitchen-design-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "web_server"]
packages = ["kitchen"]

[tool.pyright]
# Static typing of the portable core (rule R5). The module list lives in tests/architecture_rules.py (CORE_MODULES);
# tests/test_typecheck.py runs pyright on exactly those files and compares the error count per file with
# tests/typecheck_baseline.json, which may only shrink.
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["kitchen"]
